[General]
network = MyProject.simulations.EmailNetwork

sim-time-limit = 15s

# Cloud parameters
*.cloud.delayMean = 0.05s
*.cloud.delayJitter = 0.02s
*.cloud.dropProbability = 0.0

# Spam filter
*.spam.spamKeywords = "free,prize"

# Record signals for analysis
record-eventlog = true
**.scalar-recording = true
**.vector-recording = true
